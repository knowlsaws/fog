name: train-classifier

# 魚種判定モデルの学習（macOS ランナーの Create ML）。手動実行。
# 公開データ（iNaturalist、CC ライセンス）に、開発者の写真（zip の URL、任意）を加えて学習し、
# 精度が受け入れ条件（Top-1 90%・Top-3 98%）を満たしたときだけモデルとレポートをコミットする。

on:
  workflow_dispatch:
    inputs:
      per_species:
        description: "公開データの 1 魚種あたりの枚数"
        required: false
        default: "200"
      photos_url:
        description: "開発者の写真 zip の URL（<標準和名>/*.jpg の構成）。空なら公開データのみ"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  train:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XCODE"
      - name: Fetch public data (iNaturalist)
        run: python3 -I scripts/train_classifier/fetch_inat.py --out data/fish --per-species "${{ inputs.per_species }}"
      - name: Add developer photos
        if: ${{ inputs.photos_url != '' }}
        run: |
          mkdir -p /tmp/photos && cd /tmp/photos
          curl -sSL -o photos.zip "${{ inputs.photos_url }}"
          unzip -q photos.zip
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import os, random, shutil
          random.seed(7)
          src = "/tmp/photos"
          for root, dirs, files in os.walk(src):
              imgs = [f for f in files if f.lower().endswith((".jpg", ".jpeg", ".png", ".heic"))]
              if not imgs: continue
              species = os.path.basename(root)
              random.shuffle(imgs)
              n_test = max(1, len(imgs) // 5)
              for i, f in enumerate(imgs):
                  split = "test" if i < n_test else "train"
                  d = os.path.join("data/fish", split, species); os.makedirs(d, exist_ok=True)
                  shutil.copy(os.path.join(root, f), os.path.join(d, "dev_" + f))
          PY
      - name: Train
        run: swift scripts/train_classifier/train.swift data/fish App/Resources/Models/FishClassifier.mlmodel docs/classifier_report.md
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/Resources/Models/FishClassifier.mlmodel docs/classifier_report.md
          git commit -m "L6: 魚種判定モデルを更新（CI で学習）"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
