name: core-tests

on:
  push:
    paths: ["Packages/Core/**", ".github/workflows/core-tests.yml"]
  pull_request:
    paths: ["Packages/Core/**", ".github/workflows/core-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build & test Core (Linux)
        working-directory: Packages/Core
        run: |
          swift build
          swift test
